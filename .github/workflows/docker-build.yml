name: Build and Push Docker Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/jekaqm/servicarr

jobs:
  build-and-push:
    name: Publish snapshot image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare snapshot version
        id: version
        run: |
          BASE_VERSION="$(tr -d '\r\n' < app/internal/buildinfo/VERSION)"
          echo "version=${BASE_VERSION}-snapshot.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=snapshot-${{ github.ref_name }}
            type=sha,prefix=snapshot-sha-,format=long
          labels: |
            org.opencontainers.image.title=Servicarr
            org.opencontainers.image.description=Self-hosted service status dashboard snapshot
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push snapshot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          SNAPSHOT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Docker snapshot published"
            echo
            echo "- Embedded version: \`${SNAPSHOT_VERSION}\`"
            echo "- Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
