name: CI

on:
  push:
    branches: [main, develop, "feature/**", "security/**"]
  pull_request:
    branches: [main, "feature/**"]

permissions:
  contents: read

jobs:
  # ─── Go ────────────────────────────────────────────────────
  go-lint:
    name: Go Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt check
        working-directory: app
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::The following files are not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Verify application version sources
        run: |
          APP_VERSION=$(tr -d '\r\n' < app/internal/buildinfo/VERSION)
          PACKAGE_VERSION=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' package.json | head -1)
          LOCK_VERSION=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' package-lock.json | head -1)
          test "$APP_VERSION" = "$PACKAGE_VERSION" && test "$APP_VERSION" = "$LOCK_VERSION" || {
            echo "::error::Version mismatch: app=$APP_VERSION package=$PACKAGE_VERSION lock=$LOCK_VERSION"
            exit 1
          }

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    needs: go-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 7

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    needs: go-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        run: cd app && go build -trimpath -ldflags="-s -w" -o ../bin/status .

      - name: Verify binary exists
        run: test -f bin/status

  # ─── JavaScript ────────────────────────────────────────────
  js-test:
    name: JS Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run Jest tests
        run: npx jest --verbose --ci --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: js-coverage
          path: coverage/
          retention-days: 7

  # ─── Docker ────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [go-build, go-test, js-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg VCS_REF=${GITHUB_SHA} -f deploy/Dockerfile -t servicarr:ci .

      - name: Verify container starts
        run: |
          docker run -d --name servicarr-test \
            -e AUTH_PASSWORD=testpass123 \
            -e AUTH_SECRET=testsecret123 \
            -p 4555:4555 \
            servicarr:ci
          sleep 5
          # Health check
          curl -sf http://localhost:4555/api/check || (docker logs servicarr-test && exit 1)
          docker stop servicarr-test
          docker rm servicarr-test

  go-vulnerabilities:
    name: Go Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  all-checks:
    name: All Checks Status
    runs-on: ubuntu-latest
    if: always()
    needs: [go-lint, go-test, go-build, js-test, docker-build, go-vulnerabilities]
    steps:
      - name: Require every CI job to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; . == "success")'
